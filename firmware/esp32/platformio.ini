[platformio]
default_envs = esp32dev_serial

[env]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps = bblanchon/ArduinoJson@7.4.2

[env:esp32dev_serial]
; Explicit commissioning mode: enter measured centimeters in the USB serial monitor.
build_flags = -D FLOODNAV_SERIAL_INPUT=1

[env:esp32dev_sensor]
; Implement the hardware-specific adapter in src/sensor.cpp before deployment.
build_flags = -D FLOODNAV_SERIAL_INPUT=0

[env:esp32dev_test]
test_filter = test_measurement
